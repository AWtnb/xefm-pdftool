[project]
name = "xefm-pdftool"
version = "0.1.0"
description = "PDF merge, split, and rotate actions for XeFM"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xefm_pdftool"]

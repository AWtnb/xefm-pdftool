[project]
name = "xefm-pdftool"
version = "0.1.3"
description = "PDF editing and transformation actions for XeFM"
requires-python = ">=3.10"
dependencies = [
    "pikepdf>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xefm_pdftool"]
